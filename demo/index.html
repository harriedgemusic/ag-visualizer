<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Work Map — Browser Demo</title>
  <style>
    :root {
      --ag-dim: #9ba1ab;
      --ag-border: #272c36;
      --ag-accent: #e1ac6e;
      --ag-error: #e8654f;
      --ag-panel: #12151c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: SF Mono, ui-monospace, Menlo, Consolas, monospace;
      background: #0a0c11;
      color: #ebe6dc;
      font-size: 12px;
      transition: background 180ms ease, color 180ms ease;
    }
    .page {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ag-border);
    }
    .title h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 600;
    }
    .title p {
      margin: 0;
      color: var(--ag-dim);
      font-size: 11px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, select {
      font-family: inherit;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--ag-border);
      background: var(--ag-panel);
      color: inherit;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 480px) minmax(300px, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      border: 1px solid var(--ag-border);
      border-radius: 12px;
      padding: 14px;
      background: var(--ag-panel);
    }
    .map-stage svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .now-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 2px;
      border-top: 1px solid var(--ag-border);
      border-bottom: 1px solid var(--ag-border);
      margin-top: 8px;
    }
    .now-meter { color: var(--ag-dim); }
    .feed {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 8px;
    }
    .row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      line-height: 1.45;
    }
    .row-mark { width: 10px; flex-shrink: 0; }
    .row-station { width: 76px; flex-shrink: 0; }
    .row-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-meta { flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .row.is-running, .row.is-switch { color: var(--ag-accent); }
    .row.is-error { color: var(--ag-error); }
    .row.is-ok { color: var(--ag-dim); }
    .privacy-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .privacy-box h2 {
      margin: 0 0 8px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--ag-accent);
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--ag-border);
      background: rgba(0, 0, 0, 0.22);
      overflow-x: auto;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="title">
        <h1>Antigravity Work Map — Live Browser Demo</h1>
        <p>Runs the exact extension core engine: passive, read-only, zero secrets kept.</p>
      </div>
      <div class="controls">
        <button id="btn-play" type="button">Pause</button>
        <button id="btn-step" type="button">Step</button>
        <button id="btn-restart" type="button">Restart</button>
        <select id="sel-lang" aria-label="Language"></select>
        <select id="sel-theme" aria-label="Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
        <select id="sel-layout" aria-label="Layout">
          <option value="you-top">You top</option>
          <option value="you-bottom">You bottom</option>
        </select>
        <select id="sel-motion" aria-label="Motion">
          <option value="full">Full motion</option>
          <option value="reduced">Reduced motion</option>
        </select>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div id="demo-map" class="map-stage"></div>
        <div class="now-bar">
          <span id="demo-now-what"></span>
          <span id="demo-now-meter" class="now-meter"></span>
        </div>
        <div id="demo-feed" class="feed"></div>
      </div>
      <div class="privacy-grid">
        <div class="card privacy-box">
          <h2>1. What Antigravity wrote to transcript.jsonl (raw step)</h2>
          <pre id="demo-raw"></pre>
        </div>
        <div class="card privacy-box">
          <h2>2. What the Work Map actually kept in memory</h2>
          <pre id="demo-kept"></pre>
        </div>
      </div>
    </div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
