name: Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-openvsx
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, AST surface, tests, build)
        run: npm run check

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository --out ag-visualizer.vsix

      - name: Publish to Open VSX (OIDC Trusted Publishing)
        run: npx --yes ovsx@1.4.0 publish ./ag-visualizer.vsix --trusted-publishing --skip-duplicate
